# ACoder Configuration File
#
# Color Formats Supported:
# - Legacy: &a, &c, &l, &n, etc.
# - HEX: &#RRGGBB (example: &#FF5555 for red)
# - You can mix them: &#0BA6DF&lREDEEM &d>> &fSuccess!

prefix: "&#0BA6DF&lREDEEM &8»"

messages:
  success: "&aYou have successfully redeemed the code!"
  invalid: "&cThis code does not exist!"
  used: "&eYou already redeemed this code!"
  no-permission: "&cYou don't have permission!"
  reload: "&aConfig reloaded successfully!"
  code-created: "&aCode '%code%' has been created successfully!"
  code-deleted: "&aCode '%code%' has been deleted successfully!"
  code-exists: "&cCode '%code%' already exists!"
  code-not-found: "&cCode '%code%' does not exist!"
  usage-redeem: "&cUsage: /redeem <code>"
  invalid-number: "&cLimit must be a number, 0 or greater!"
  usage-create: "&cUsage: /acoder create <code>"
  usage-delete: "&cUsage: /acoder delete <code>"
  list-header: "&6=== Active Codes ==="
  list-entry: "&e- %code% &7(Redeemed: %count%/%limit% times) %status%"
  list-empty: "&eNo codes available."
  limit-reached: "&cThis code has reached its usage limit!"
  code-expired: "&cThis code has expired!"
  usage-setlimit: "&cUsage: /acoder setlimit <code> <amount>"
  usage-setexpiry: "&cUsage: /acoder setexpiry <code> <DD-MM-YYYY>"
  limit-set: "&aLimit for '%code%' has been set to %limit%"
  expiry-set: "&aExpiry date for '%code%' has been set to %date%"
  invalid-date: "&cInvalid date format! Use DD-MM-YYYY (example: 31-12-2030)"

# Redeem codes. Rewards are console commands; %player_name% is the player.
# max-uses: 0 = unlimited. expiry-date (DD-MM-YYYY) is optional and valid through that day.
codes:
  TESTCODE:
    rewards:
      - "give %player_name% emerald 10"
      - "give %player_name% diamond 5"
    max-uses: 0  # 0 = unlimited
    # expiry-date: "31-12-2030"  # Optional: uncomment to set expiry

  WELCOME2026:
    rewards:
      - "give %player_name% golden_apple 3"
      - "give %player_name% experience_bottle 10"
    max-uses: 100  # Can only be used 100 times total
    expiry-date: "31-12-2030"
