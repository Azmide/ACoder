name: ACoder
version: '1.3'
main: io.github.AzmiiD.aCoder.ACoder
api-version: '26.2'
authors: [ AzmiiD ]
description: Redeem codes for rewards

commands:
  redeem:
    description: Redeem a code for rewards
    usage: /<command> <code>
    aliases: [code]
  acoder:
    description: Admin commands for ACoder
    usage: /<command> <create|delete|setlimit|setexpiry|list|reload>
    permission: acoder.admin

permissions:
  acoder.admin:
    description: Allows access to admin commands
    default: op
  acoder.redeem:
    description: Allows players to redeem codes
    default: true
