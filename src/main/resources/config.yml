# ACoder configuration. Messages live in lang.yml.
#
# Colors: MiniMessage (<red>, <gradient:red:blue>), legacy (&a) and hex (&#RRGGBB) are all supported.

prefix: "&#0BA6DF&lREDEEM &8»"

redeem:
  # Also block a code when someone from the same IP address already used it.
  block-same-ip: true
  # Wrong codes in a row before the player is locked out (0 = never lock).
  max-failed-attempts: 5
  lockout-seconds: 60
  # Sound played on success, e.g. entity.player.levelup (empty = none).
  success-sound: "entity.player.levelup"

# Redeem codes (letters, numbers, _ and - only; case-insensitive for players).
#
# Rewards are run as console commands. Placeholders: %player_name%, {player}, {uuid}.
# Optional prefixes:
#   [player] <command>    run the command as the player
#   [message] <text>      send the player a message (MiniMessage/legacy colors)
#   [broadcast] <text>    broadcast a message to everyone
#
# max-uses: 0 = unlimited. expiry-date (DD-MM-YYYY) is optional and valid through that day.
codes:
  TESTCODE:
    rewards:
      - "give %player_name% emerald 10"
      - "give %player_name% diamond 5"
    max-uses: 0

  WELCOME2026:
    rewards:
      - "give %player_name% golden_apple 3"
      - "give %player_name% experience_bottle 10"
      - "[broadcast] <green>{player} <gray>redeemed <yellow>WELCOME2026<gray>!"
    max-uses: 100
    expiry-date: "31-12-2030"
