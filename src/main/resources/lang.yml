# ACoder messages. Supports MiniMessage (<red>, <gradient:red:blue>), legacy (&a) and hex (&#RRGGBB) colors.
# {prefix} is replaced with the prefix from config.yml. An empty message is not sent.

no-permission: "{prefix} <red>You don't have permission!"
player-only: "{prefix} <red>This command can only be used by players!"
reloaded: "{prefix} <green>Configuration reloaded."

redeem:
  usage: "{prefix} <red>Usage: /redeem <code>"
  success: "{prefix} <green>You have successfully redeemed the code!"
  invalid: "{prefix} <red>This code does not exist!"
  used: "{prefix} <yellow>You already redeemed this code!"
  expired: "{prefix} <red>This code has expired!"
  limit-reached: "{prefix} <red>This code has reached its usage limit!"
  locked: "{prefix} <red>Too many wrong codes! Try again in {seconds}s."

admin:
  usage-create: "{prefix} <red>Usage: /acoder create <code>"
  usage-delete: "{prefix} <red>Usage: /acoder delete <code>"
  usage-info: "{prefix} <red>Usage: /acoder info <code>"
  usage-reset: "{prefix} <red>Usage: /acoder reset <code>"
  usage-setlimit: "{prefix} <red>Usage: /acoder setlimit <code> <amount>"
  usage-setexpiry: "{prefix} <red>Usage: /acoder setexpiry <code> <DD-MM-YYYY|never>"
  usage-addreward: "{prefix} <red>Usage: /acoder addreward <code> <command...>"
  usage-removereward: "{prefix} <red>Usage: /acoder removereward <code> <number>"
  invalid-name: "{prefix} <red>Code names may only contain letters, numbers, '_' and '-' (max 32 characters)."
  invalid-number: "{prefix} <red>The amount must be a number, 0 or greater!"
  invalid-index: "{prefix} <red>Reward number must be between 1 and {max}!"
  invalid-date: "{prefix} <red>Invalid date! Use DD-MM-YYYY (example: 31-12-2030) or 'never'."
  code-created: "{prefix} <green>Code '{code}' has been created. Add rewards with /acoder addreward."
  code-deleted: "{prefix} <green>Code '{code}' has been deleted."
  code-exists: "{prefix} <red>Code '{code}' already exists!"
  code-not-found: "{prefix} <red>Code '{code}' does not exist!"
  limit-set: "{prefix} <green>Limit for '{code}' set to {limit}."
  expiry-set: "{prefix} <green>Expiry date for '{code}' set to {date}."
  expiry-cleared: "{prefix} <green>'{code}' no longer expires."
  reward-added: "{prefix} <green>Added reward to '{code}': <white>{reward}"
  reward-removed: "{prefix} <green>Removed reward from '{code}': <white>{reward}"
  reset-done: "{prefix} <green>Cleared {count} redemption(s) of '{code}'."
  list-header: "<gold>=== Codes ({count}) ==="
  list-entry: "<yellow>- {code} <gray>({count}/{limit} redeemed) {status}"
  list-empty: "{prefix} <yellow>No codes available."
  status-active: "<green>[Active]"
  status-expires: "<green>[Expires: {date}]"
  status-expired: "<red>[EXPIRED]"
  status-full: "<red>[LIMIT REACHED]"
  info-header: "<gold>=== Code {code} ==="
  info-line: "<yellow>{label}: <white>{value}"
  info-reward: "<gray> {index}. <white>{reward}"
  help-header: "{prefix} <gold>ACoder commands:"
  help-line: "<yellow>{usage} <gray>- {description}"
